name: desktop-electron-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-14
            builder: --mac --arm64
          - platform: mac
            arch: x64
            runner: macos-14
            builder: --mac --x64
          - platform: win
            arch: x64
            runner: windows-latest
            builder: --win --x64
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            builder: --linux --x64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop-electron/pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang \
            libfontconfig1-dev libfreetype6-dev libssl-dev \
            libfuse2

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: dbx-web-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Build DBX web backend
        run: >
          cargo build --release -p dbx-web
          --no-default-features
          --features duckdb-sidecar,dynamodb,mq-admin,dbx-core/sqlite-bundled

      - name: Copy backend sidecar (unix)
        if: matrix.platform != 'win'
        run: |
          mkdir -p apps/desktop-electron/backend
          cp target/release/dbx-web apps/desktop-electron/backend/dbx-web
          chmod +x apps/desktop-electron/backend/dbx-web

      - name: Copy backend sidecar (windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop-electron/backend | Out-Null
          Copy-Item target/release/dbx-web.exe apps/desktop-electron/backend/dbx-web.exe

      - name: Install frontend dependencies
        working-directory: apps/desktop-electron
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: apps/desktop-electron
        run: pnpm build

      - name: Package installer
        working-directory: apps/desktop-electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs ${{ matrix.builder }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: DBX-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop-electron/release/*.dmg
            apps/desktop-electron/release/*.zip
            apps/desktop-electron/release/*.exe
            apps/desktop-electron/release/*.AppImage
            apps/desktop-electron/release/*.deb
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish download installers
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
