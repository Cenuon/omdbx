name: desktop-gpui-release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: build macOS arm64
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop-gpui -> apps/desktop-gpui/target

      - name: Build app, dmg, and zip
        run: sh apps/desktop-gpui/scripts/package-macos.sh arm64

      - name: Verify signed bundle and disk image
        run: |
          codesign --verify --deep --strict dist/desktop-gpui/OMDBX.app
          hdiutil verify dist/desktop-gpui/OMDBX-*-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: OMDBX-macos-arm64
          path: |
            dist/desktop-gpui/*.dmg
            dist/desktop-gpui/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release assets
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build-macos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
