[workspace]
resolver = "2"
members = ["crates/dbx-core", "crates/dbx-driver-agent", "crates/dbx-driver-support", "crates/dbx-driver-elasticsearch", "crates/dbx-driver-mongodb", "crates/dbx-driver-mysql", "crates/dbx-driver-postgres", "crates/dbx-driver-redis", "crates/dbx-driver-sqlserver", "crates/dbx-drivers", "crates/dbx-sql", "crates/dbx-sql-core", "crates/dbx-sql-data", "crates/dbx-sql-dialect", "crates/dbx-sql-schema", "crates/dbx-plugin-runtime", "crates/dbx-formats", "crates/dbx-types", "crates/dbx-platform", "crates/dbx-ai-provider", "crates/dbx-web", "crates/dbx-mcp", "crates/dbx-cli", "crates/dbx-sqlite-worker"]
exclude = ["vendor/dirs-sys", "vendor/pageant", "vendor/rumqttc", "vendor/tiberius"]

[patch.crates-io]
# Keep two small upstream crates on Win7-compatible API calls. Their current
# Windows bindings otherwise import COMBASE or WinRT APIs unavailable on Win7.
dirs-sys = { path = "vendor/dirs-sys" }
pageant = { path = "vendor/pageant" }
# rumqttc 0.24 hardcodes MQTT 3.1.1; this patch adds MQTT 3.1 CONNECT encoding.
rumqttc = { path = "vendor/rumqttc" }
tokio-postgres = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-types = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
postgres-protocol = { git = "https://github.com/t8y2/tokio-postgres-gaussdb.git", rev = "ac8ad476de59093d33ab9f294531c956e0c6a724" }
# Temporary compatibility patches for deprecated sha256_password accounts and
# rustls dangerous-mode connections to legacy certificates. Remove after upstream support lands.
mysql_async = { git = "https://github.com/zipg/mysql_async.git", rev = "4a9e60a62f5a48e35ef9ccc9fc8277d5012b19dd" }
# Preserve readable SQL Server result sets when a row contains an unpaired
# UTF-16 surrogate, or varchar/text bytes that are invalid in the column's
# collation (replaced with U+FFFD, no BOM sniffing). Remove after the behavior
# is available in upstream tiberius.
tiberius = { path = "vendor/tiberius" }

[profile.dev.package."*"]
# Dependencies are never breakpoint-inspected in dev; line tables keep
# backtraces resolvable while shrinking dev/test build time and artifacts.
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
